name: Fetch site images

# Run from the Actions tab ("Run workflow"), or automatically when this file or the fetch script
# changes on main. Loads the live site in a browser, saves every image it
# finds to assets/img/site/ (plus a manifest.json listing where each came from) and opens a pull
# request with the result. The images are also attached to the run as a downloadable zip.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-images.yml
      - scripts/fetch-site-images.mjs
  workflow_dispatch:
    inputs:
      site_url:
        description: Site to read images from
        default: https://www.siyandaplatinum.com
      max_pages:
        description: Maximum number of pages to visit
        default: '40'

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Download images
        env:
          SITE_URL: ${{ inputs.site_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: node scripts/fetch-site-images.mjs

      - name: Keep a copy as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-images
          path: assets/img/site
          if-no-files-found: error

      - name: Commit to a branch and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          git add assets/img/site
          if git diff --cached --quiet; then
            echo "No new or changed images."
            exit 0
          fi
          branch="chore/site-images-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Add images fetched from ${SITE_URL:-https://www.siyandaplatinum.com}"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "Add images fetched from the live site" \
            --body "Images saved by the Fetch site images workflow (run ${GITHUB_RUN_ID}). See assets/img/site/manifest.json for the source page and alt text of each file." \
            || echo "Could not open a pull request automatically (check Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'). The branch $branch has been pushed; open the PR from it, or use the downloadable artifact."
